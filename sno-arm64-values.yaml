# SNO aarch64 test cluster - phase16 deployment
# Cluster: sno.karmalabs.corp (OCP 4.22 aarch64)
# Uses internal OCP image registry

# insights-rbac is amd64-only; Koku uses ENHANCED_ORG_ADMIN when RBAC is disabled.
rbac:
  enabled: false

global:
  clusterDomain: "apps.sno.karmalabs.corp"
  storageClass: "lvms-vg1"
  pullPolicy: IfNotPresent

# Custom arm64 ROS image (phase16: native engine, quotas, cluster-quotas)
ros:
  image:
    repository: image-registry.openshift-image-registry.svc:5000/cost-onprem/ros-ocp-backend
    tag: "phase16-20260715"
    pullPolicy: IfNotPresent
  api:
    businessHoursEnabled: true
    enabledPlugins: ""
    disabledPlugins: ""
    quotaRecommendations:
      headroomPercent: 10
      highRiskThresholdPercent: 90
      mediumRiskThresholdPercent: 70
    clusterQuotaRecommendations:
      headroomPercent: 10
      highRiskThresholdPercent: 90
      mediumRiskThresholdPercent: 70

# Custom arm64 Koku image
costManagement:
  api:
    enabled: true
    env:
      ENHANCED_ORG_ADMIN: "True"
    image:
      repository: image-registry.openshift-image-registry.svc:5000/cost-onprem/koku
      tag: "phase16-20260715"
      pullPolicy: IfNotPresent
  celery:
    pollingTimer: 60
    workers:
      default:
        replicas: 2
        concurrency: 8
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
      priority:
        replicas: 2
        concurrency: 8
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "3Gi"
      summary:
        replicas: 2
        concurrency: 8
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "4"
            memory: "4Gi"
      ocp:
        replicas: 2
        concurrency: 8
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "4"
            memory: "3Gi"
      costModel:
        replicas: 2
        concurrency: 8
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
  listener:
    replicas: 2

# Custom arm64 ingress image
ingress:
  image:
    repository: image-registry.openshift-image-registry.svc:5000/cost-onprem/insights-ingress-go
    tag: "phase16-20260715"
    pullPolicy: IfNotPresent

# Stock multi-arch PostgreSQL (docker.io/library/postgres:16)
database:
  server:
    image:
      repository: image-registry.openshift-image-registry.svc:5000/cost-onprem/postgresql
      tag: "16"
    initScriptsMountPath: /docker-entrypoint-initdb.d
    storage:
      size: "20Gi"
  ros:
    storage:
      size: "5Gi"
  kruize:
    storage:
      size: "5Gi"
  sources:
    storage:
      size: "5Gi"

# Kruize disabled - native engine only
kruize:
  enabled: false

# S3/MinIO - chart-internal MinIO (no ODF on this cluster)
objectStorage:
  secretName: cost-onprem-storage-credentials
  endpoint: "minio.cost-onprem.svc.cluster.local"
  port: 9000
  useSSL: false

# Kafka
kafka:
  bootstrapServers: "cost-onprem-kafka-kafka-bootstrap.kafka.svc:9092"

# Keycloak/JWT
jwtAuth:
  keycloak:
    installed: true
    url: "https://keycloak-keycloak.apps.sno.karmalabs.corp"
    namespace: "keycloak"
    serviceName: "keycloak-service"
    realm: "cost-management"
    client:
      id: "cost-management-ui"
    audiences:
      - cost-management-operator
      - cost-management-ui
      - account
    tls:
      insecureSkipVerify: true
  envoy:
    routeTimeout: "300s"
    routePerTryTimeout: "150s"

# Valkey - custom arm64 image
valkey:
  image:
    repository: image-registry.openshift-image-registry.svc:5000/cost-onprem/valkey
    tag: "8"
    pullPolicy: IfNotPresent
  persistence:
    storageClassName: "lvms-vg1"

# Routes
gatewayRoute:
  enabled: true
  annotations:
    haproxy.router.openshift.io/timeout: "300s"
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# Resources for SNO (generous: 100 vCPUs / 160 GiB)
resources:
  application:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1"

# koku-ui enabled
ui:
  replicaCount: 1
  app:
    image:
      repository: image-registry.openshift-image-registry.svc:5000/cost-onprem/koku-ui
      tag: "phase16-20260715"
      pullPolicy: IfNotPresent
