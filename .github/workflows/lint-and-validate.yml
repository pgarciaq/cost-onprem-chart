name: Lint and Validate Helm Chart

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'cost-onprem/**'
      - '.github/workflows/lint-and-validate.yml'
  workflow_dispatch:

jobs:
  helm-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Helm
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        helm version

    - name: Lint Helm chart
      run: |
        echo "=== Linting Helm chart ==="
        cd cost-onprem
        helm lint .

    - name: Validate Helm templates (zero --set, oc-mirror parity)
      run: |
        echo "=== Validating Helm templates with defaults only (oc-mirror parity) ==="
        cd cost-onprem
        helm template cost-onprem . > /tmp/rendered.yaml
        echo "✓ helm template with ZERO --set flags succeeded"

    - name: Assert ROS Kafka consumers never auto-commit
      run: |
        set -euo pipefail

        echo "=== Asserting KAFKA_AUTO_COMMIT renders as false for every ROS consumer ==="
        # ros-ocp-backend #893: with auto-commit on, librdkafka stores an offset
        # when a message is polled and commits it ~5 s later, before the
        # pipeline finishes. A DB hiccup during ingest then discards accepted
        # uploads with no retry, no DLQ entry and no report_file_status row.
        # The chart default overrode the backend's own safe default once
        # already; a values comment alone does not stop that recurring.
        rendered=$(helm template cost-onprem cost-onprem)
        entries=$(printf '%s\n' "$rendered" | awk '
          { line = $0; sub(/^[[:space:]]+/, "", line); sub(/[[:space:]]+$/, "", line) }
          line == "- name: KAFKA_AUTO_COMMIT" { want = 1; next }
          want { print line; want = 0 }
        ')
        count=$(printf '%s\n' "$entries" | grep -c . || true)
        distinct=$(printf '%s\n' "$entries" | sort -u)

        echo "found ${count} KAFKA_AUTO_COMMIT entries:"
        echo "$distinct"

        # processor + recommendation-poller: a drop here means the env was
        # renamed or removed, which would make this assertion vacuous.
        if [ "$count" -lt 2 ]; then
          echo "::error::expected at least 2 KAFKA_AUTO_COMMIT entries (processor, recommendation-poller), found ${count}"
          exit 1
        fi
        if [ "$distinct" != 'value: "false"' ]; then
          echo "::error::KAFKA_AUTO_COMMIT must render as \"false\" for every ROS Kafka consumer (ros-ocp-backend #893)"
          exit 1
        fi

        echo "✓ ${count} KAFKA_AUTO_COMMIT entries, all false"

    - name: Assert ROS connection budget satisfies the product rule
      run: |
        set -euo pipefail

        echo "=== Asserting ROS_DB_MAX_CONNS satisfies the product's pool rule ==="
        # ros-ocp-backend #898: the product warns at startup when
        # ManifestDownloadWorkers × KafkaWorkers > DBMaxConns − 2 (the
        # reserve for recommendations + health checks). The chart does not
        # override the worker fan-out, so the product defaults apply
        # (2 download workers × 3 kafka workers = 6 in-flight connections),
        # and every rendered ROS_DB_MAX_CONNS must be ≥ 8. A drop below
        # that recreates the underfed pool the processor warns about on
        # every start — announced once, then ignored.
        rendered=$(helm template cost-onprem cost-onprem)
        entries=$(printf '%s\n' "$rendered" | awk '
          { line = $0; sub(/^[[:space:]]+/, "", line); sub(/[[:space:]]+$/, "", line) }
          line == "- name: ROS_DB_MAX_CONNS" { want = 1; next }
          want { print line; want = 0 }
        ')
        count=$(printf '%s\n' "$entries" | grep -c . || true)
        distinct=$(printf '%s\n' "$entries" | sort -u)

        echo "found ${count} ROS_DB_MAX_CONNS entries:"
        echo "$distinct"

        # A drop here means the env was renamed or removed, which would
        # make this assertion vacuous.
        if [ "$count" -lt 1 ]; then
          echo "::error::no ROS_DB_MAX_CONNS entries rendered"
          exit 1
        fi

        min_conns=8
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          conns=$(printf '%s' "$line" | grep -oP 'value: "?\K[0-9]+')
          if [ -z "$conns" ]; then
            echo "::error::could not parse ROS_DB_MAX_CONNS value from: ${line}"
            exit 1
          fi
          if [ "$conns" -lt "$min_conns" ]; then
            echo "::error::ROS_DB_MAX_CONNS=${conns} breaks the product rule: 2 download workers × 3 kafka workers = 6 in-flight, +2 reserved = ${min_conns} minimum (ros-ocp-backend #898)"
            exit 1
          fi
        done <<< "$distinct"

        echo "✓ ${count} ROS_DB_MAX_CONNS entries, all ≥ ${min_conns} (product rule satisfied)"

    - name: Assert postgresqlConfiguration applies on any image family
      run: |
        set -euo pipefail

        echo "=== Asserting ALTER SYSTEM init SQL is generated from postgresqlConfiguration ==="
        # ros-ocp-backend #899: the sclorg postgresql-cfg/ hook only exists
        # on sclorg/RHEL images; the library postgres image has no such
        # hook (upstream's postgresql.conf.sample ships include_dir
        # commented out), so the mounted conf was silently ignored on
        # custom-image deployments. The values must also render as
        # ALTER SYSTEM init SQL, which every image family runs from its
        # init-scripts directory and which persists to postgresql.auto.conf.
        rendered=$(helm template cost-onprem cost-onprem)
        # Herestrings, not pipes: grep -q exits on first match, so a piped
        # printf dies of SIGPIPE and `set -o pipefail` turns the successful
        # match into a pipeline failure (caught by the real-runner dispatch).
        if ! grep -q 'ALTER SYSTEM SET shared_buffers' <<<"$rendered"; then
          echo "::error::postgresqlConfiguration must render as ALTER SYSTEM init SQL (image-family independent) — ros-ocp-backend #899"
          exit 1
        fi
        # The sclorg hook path stays for sclorg/RHEL images (re-applies on
        # every container start); both mechanisms carry the same values.
        if ! grep -q 'shared_buffers = ' <<<"$rendered"; then
          echo "::error::the sclorg postgresql-cfg conf must still render (re-application path) — ros-ocp-backend #899"
          exit 1
        fi

        echo "✓ postgresqlConfiguration renders as both ALTER SYSTEM init SQL and the sclorg conf"

    - name: Verify oc-mirror compatibility
      run: |
        set -euo pipefail

        echo "=== Starting local registry ==="
        docker run -d --name registry -p 5050:5000 registry:2
        sleep 2

        echo "=== Downloading oc-mirror ==="
        curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/oc-mirror.tar.gz | tar -xzf -
        chmod +x oc-mirror

        echo "=== Creating ImageSetConfiguration ==="
        # additionalImages lists images that oc-mirror cannot auto-discover
        # from the Helm chart (e.g. images only used in Helm hooks like
        # pre-install/pre-upgrade). Keep this list in sync with the
        # disconnected deployment guide (commands to list images):
        #   docs/operations/disconnected-deployment.md
        cat > /tmp/imageset-config.yaml << 'EOF'
        apiVersion: mirror.openshift.io/v2alpha1
        kind: ImageSetConfiguration
        mirror:
          helm:
            local:
              - name: cost-onprem
                path: ./cost-onprem
          additionalImages:
            - name: registry.redhat.io/rhel10/postgresql-16:10.1
        EOF

        echo "=== Running oc-mirror --dry-run --v2 ==="
        ./oc-mirror --config /tmp/imageset-config.yaml --workspace file:///tmp/oc-mirror-workspace docker://localhost:5050 --dry-run --v2 --dest-tls-verify=false

        echo "✓ oc-mirror can discover and plan the mirror from the Helm chart"

    - name: Verify image parity (helm template vs oc-mirror)
      if: success()
      run: |
        set -euo pipefail

        echo "=== Extracting images from helm template output ==="
        HELM_IMAGES=$(grep -oP 'image:\s*"?\K[^"\s]+' /tmp/rendered.yaml | sort -u)
        echo "Images found by helm template:"
        echo "$HELM_IMAGES"
        echo ""

        echo "=== Extracting images planned by oc-mirror ==="
        MAPPING_FILE=$(find /tmp/oc-mirror-workspace -name "mapping.txt" -type f 2>/dev/null | head -1)
        if [ -z "$MAPPING_FILE" ]; then
          echo "ERROR: No mapping.txt found in oc-mirror workspace."
          echo "Workspace contents:"
          find /tmp/oc-mirror-workspace -type f 2>/dev/null || true
          exit 1
        fi

        OC_MIRROR_IMAGES=$(cut -d= -f1 "$MAPPING_FILE" | sed 's|docker://||' | sort -u)
        echo "Images planned by oc-mirror:"
        echo "$OC_MIRROR_IMAGES"
        echo ""

        echo "=== Comparing image lists ==="
        MISSING=()
        while IFS= read -r helm_img; do
          [ -z "$helm_img" ] && continue
          helm_repo="${helm_img%%:*}"
          FOUND=false
          while IFS= read -r mirror_img; do
            [ -z "$mirror_img" ] && continue
            if [[ "$mirror_img" == *"$helm_repo"* ]]; then
              FOUND=true
              break
            fi
          done <<< "$OC_MIRROR_IMAGES"
          if [ "$FOUND" = false ]; then
            MISSING+=("$helm_img")
          fi
        done <<< "$HELM_IMAGES"

        if [ ${#MISSING[@]} -gt 0 ]; then
          echo ""
          echo "❌ IMAGE PARITY CHECK FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "The following images appear in 'helm template' output but were"
          echo "NOT discovered by oc-mirror:"
          echo ""
          for img in "${MISSING[@]}"; do
            echo "  ✗ $img"
          done
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "WHAT HAPPENED:"
          echo "  oc-mirror cannot auto-discover images from Helm hooks"
          echo "  (pre-install/pre-upgrade) or conditional template blocks."
          echo "  These must be listed explicitly as additionalImages."
          echo ""
          echo "HOW TO FIX:"
          echo "  1. Add the missing images to 'additionalImages' in:"
          echo "     .github/workflows/lint-and-validate.yml"
          echo ""
          echo "     additionalImages:"
          for img in "${MISSING[@]}"; do
            echo "       - name: $img"
          done
          echo ""
          echo "  2. See docs/operations/disconnected-deployment.md for commands"
          echo "     to list images from oc-mirror (dry-run mapping.txt)."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1
        fi

        echo "✓ All helm template images are covered by oc-mirror"

    - name: Cleanup registry
      if: always()
      run: |
        docker stop registry || true
        docker rm registry || true

    - name: Validate Helm templates (with overrides)
      run: |
        echo "=== Validating Helm templates with overrides ==="
        cd cost-onprem
        helm template cost-onprem-test . --debug --dry-run \
          --set objectStorage.endpoint=s3.test.example.com \
          --set objectStorage.credentials.accessKey=test-access-key \
          --set objectStorage.credentials.secretKey=test-secret-key \
          --set global.clusterDomain=test.example.com \
          --set jwtAuth.keycloak.url=https://keycloak.test.example.com > /tmp/rendered-overrides.yaml
        echo "✓ Helm template validation with overrides completed successfully"

    - name: Validate Label Standards
      run: |
        echo "=== Validating Kubernetes label standards ==="
        chmod +x scripts/validate-labels.sh
        ./scripts/validate-labels.sh /tmp/rendered.yaml

