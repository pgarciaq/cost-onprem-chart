---
# Session seed: GPU time-slicing (T4) + MIG (H100) container digests.
generators:
  - OCPGenerator:
      start_date: last_month
      end_date: today
      nodes:
        - node:
          node_name: seed-gpu-ts-node
          node_labels: nvidia_com_gpu_present:True|label_environment:production
          cpu_cores: 32
          memory_gig: 256
          resource_id: seed-gpu-ts-001
          namespaces:
            seed-gpu-ts:
              namespace_labels: label_team:ml|label_environment:production
              pods:
                - pod:
                  pod_name: seed-ts-worker-a
                  cpu_request: 4
                  mem_request_gig: 16
                  cpu_limit: 8
                  mem_limit_gig: 32
                  pod_seconds: 3600
                  cpu_usage:
                    full_period: 1.5
                  mem_usage_gig:
                    full_period: 8
                  labels: label_app:pytorch|label_workload:training
                  gpus:
                    - gpu:
                      gpu_model: "Tesla T4"
                      gpu_memory_capacity_mib: 15360
                      sm_active_avg: 0.12
                      tensor_pipe_active_avg: 0.05
                      dram_active_avg: 0.08
                      fb_usage_avg: 1200.0
                - pod:
                  pod_name: seed-ts-worker-b
                  cpu_request: 4
