          cpu_limit_used: 36
          memory_request_used_gig: 45
          memory_limit_used_gig: 90
          storage_request_hard_gig: 500
          storage_request_used_gig: 420
          pods_hard: 200
          pods_used: 175
          object_count_hard: 0
          object_count_used: 0
          namespaces: seed-crq-ns
        - name: seed-crq-platform
          cpu_request_hard: 30
