---
# Combined GPU ROS data: time-slicing (T4) + MIG (H100) + model diversity (A100).
# Use with generate_nise_data(..., iqe_template="ocp_report_gpu_combined.yml", include_ros=True)
generators:
  - OCPGenerator:
      start_date: last_month
      end_date: today
      nodes:
        - node:
          node_name: gpu-ts-node-1
          node_labels: label_node_name:gpu-ts-node-1|label_tier:node|nvidia_com_gpu_present:True|label_environment:production
          cpu_cores: 32
          memory_gig: 256
          resource_id: i-gpu-ts-001
          namespaces:
            ml-training:
              namespace_labels: project_name:ml-training|label_environment:production
              pods:
                - pod:
                  pod_name: ts-worker-a
                  cpu_request: 4
                  mem_request_gig: 16
                  cpu_limit: 8
                  mem_limit_gig: 32
                  pod_seconds: 3600
                  cpu_usage:
                    full_period: 1.5
                  mem_usage_gig:
                    full_period: 8
                  labels: label_app:pytorch|label_workload:training|label_environment:production
                  gpus:
                    - gpu:
                      gpu_model: "Tesla T4"
                      gpu_memory_capacity_mib: 15360
                      sm_active_avg: 0.12
                      tensor_pipe_active_avg: 0.05
                      dram_active_avg: 0.08
                      fb_usage_avg: 1200.0
                - pod:
                  pod_name: ts-worker-b
                  cpu_request: 4
                  mem_request_gig: 16
                  cpu_limit: 8
                  mem_limit_gig: 32
                  pod_seconds: 3600
                  cpu_usage:
                    full_period: 1.2
                  mem_usage_gig:
                    full_period: 7
                  labels: label_app:pytorch|label_workload:training|label_environment:production
                  gpus:
                    - gpu:
                      gpu_model: "Tesla T4"
                      gpu_memory_capacity_mib: 15360
                      sm_active_avg: 0.10
                      tensor_pipe_active_avg: 0.04
                      dram_active_avg: 0.06
                      fb_usage_avg: 1000.0
                - pod:
                  pod_name: ts-worker-c
                  cpu_request: 4
                  mem_request_gig: 16
                  cpu_limit: 8
                  mem_limit_gig: 32
                  pod_seconds: 3600
                  cpu_usage:
                    full_period: 1.0
                  mem_usage_gig:
                    full_period: 6
                  labels: label_app:tensorflow|label_workload:inference|label_environment:production
                  gpus:
                    - gpu:
                      gpu_model: "Tesla T4"
                      gpu_memory_capacity_mib: 15360
                      sm_active_avg: 0.15
                      tensor_pipe_active_avg: 0.06
                      dram_active_avg: 0.07
                      fb_usage_avg: 1100.0
  - OCPGenerator:
      start_date: last_month
      end_date: today
      nodes:
        - node:
          node_name: e2e-mig-ros-h100
          node_labels: label_node_name:e2e-mig-ros-h100|label_tier:node|nvidia_com_gpu_present:True
          cpu_cores: 32
          memory_gig: 256
          resource_id: i-e2e-mig-ros-h100
          namespaces:
            ml-underutil-mig:
              namespace_labels: project_name:ml-underutil-mig
              pods:
                - pod:
                  pod_name: mig-rec-underutil
                  cpu_request: 4
                  mem_request_gig: 16
                  cpu_limit: 8
                  mem_limit_gig: 32
                  pod_seconds: 3600
                  cpu_usage:
                    full_period: 1.5
                  mem_usage_gig:
                    full_period: 8
                  labels: label_app:light-etl|label_workload:training
                  gpus:
                    - gpu:
                      gpu_model: "NVIDIA H100 80GB HBM3"
                      gpu_memory_capacity_mib: 81920
                      sm_active_avg: 0.12
                      tensor_pipe_active_avg: 0.08
                      dram_active_avg: 0.15
                      fb_usage_avg: 4096.0
                - pod:
                  pod_name: mig-rec-idle
                  cpu_request: 2
                  mem_request_gig: 8
                  cpu_limit: 4
                  mem_limit_gig: 16
                  pod_seconds: 3600
                  cpu_usage:
                    full_period: 0.5
                  mem_usage_gig:
                    full_period: 4
                  labels: label_app:abandoned-notebook|label_workload:idle
                  gpus:
                    - gpu:
                      gpu_model: "NVIDIA H100 80GB HBM3"
                      gpu_memory_capacity_mib: 81920
                      sm_active_avg: 0.01
                      tensor_pipe_active_avg: 0.005
                      dram_active_avg: 0.02
                      fb_usage_avg: 512.0
            embeddings-mig-ros:
              namespace_labels: project_name:embeddings-mig-ros
              pods:
                - pod:
                  pod_name: embeddings-mig-worker
                  cpu_request: 2
                  mem_request_gig: 8
                  cpu_limit: 4
                  mem_limit_gig: 16
                  pod_seconds: 3600
                  cpu_usage:
                    full_period: 1.0
                  mem_usage_gig:
                    full_period: 6
                  labels: label_app:embeddings|label_workload:inference
                  gpus:
                    - gpu:
                      gpu_model: "NVIDIA H100 80GB HBM3"
                      gpu_memory_capacity_mib: 81920
                      sm_active_avg: 0.10
                      tensor_pipe_active_avg: 0.06
                      dram_active_avg: 0.12
                      fb_usage_avg: 3500.0
  - OCPGenerator:
      start_date: last_month
      end_date: today
      nodes:
        - node:
          node_name: gpu-a100-node
          node_labels: label_node_name:gpu-a100-node|label_tier:node|nvidia_com_gpu_present:True
          cpu_cores: 64
          memory_gig: 512
          resource_id: i-gpu-a100-001
          namespaces:
            llm-inference:
              namespace_labels: project_name:llm-inference
              pods:
                - pod:
                  pod_name: llm-serving
                  cpu_request: 8
                  mem_request_gig: 32
                  cpu_limit: 16
                  mem_limit_gig: 64
                  pod_seconds: 3600
                  cpu_usage:
                    full_period: 3.0
                  mem_usage_gig:
                    full_period: 20
                  labels: label_app:llama|label_workload:inference
                  gpus:
                    - gpu:
                      gpu_model: "NVIDIA A100-SXM4-80GB"
                      gpu_memory_capacity_mib: 40960
                      sm_active_avg: 0.08
                      tensor_pipe_active_avg: 0.05
                      dram_active_avg: 0.10
                      fb_usage_avg: 8000.0
