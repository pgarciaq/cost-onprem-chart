---
# Container GPU ROS data for MIG recommendation E2E (GET /gpu/mig).
# H100 pods with low DCGM metrics on full GPU (no mig_instances) so ROS classifies
# underutilized workloads and recommends a MIG profile.
#
# Use with generate_nise_data(..., iqe_template="ocp_report_gpu_mig_ros.yml", include_ros=True)
generators:
  - OCPGenerator:
      start_date: last_month
      end_date: today
      nodes:
        - node:
          node_name: e2e-mig-ros-h100
          node_labels: label_node_name:e2e-mig-ros-h100|label_tier:node|nvidia_com_gpu_present:True
          cpu_cores: 32
          memory_gig: 256
          resource_id: i-e2e-mig-ros-h100
          namespaces:
            ml-underutil-mig:
              namespace_labels: project_name:ml-underutil-mig
              pods:
                - pod:
                  pod_name: mig-rec-underutil
                  cpu_request: 4
                  mem_request_gig: 16
                  cpu_limit: 8
                  mem_limit_gig: 32
                  pod_seconds: 3600
                  cpu_usage:
                    full_period: 1.5
                  mem_usage_gig:
                    full_period: 8
                  labels: label_app:light-etl|label_workload:training
                  gpus:
                    - gpu:
                      gpu_model: "NVIDIA H100 80GB HBM3"
                      gpu_memory_capacity_mib: 81920
                      sm_active_avg: 0.12
                      tensor_pipe_active_avg: 0.08
                      dram_active_avg: 0.15
                      fb_usage_avg: 4096.0
                - pod:
                  pod_name: mig-rec-idle
                  cpu_request: 2
                  mem_request_gig: 8
                  cpu_limit: 4
                  mem_limit_gig: 16
                  pod_seconds: 3600
                  cpu_usage:
                    full_period: 0.5
                  mem_usage_gig:
                    full_period: 4
                  labels: label_app:abandoned-notebook|label_workload:idle
                  gpus:
                    - gpu:
                      gpu_model: "NVIDIA H100 80GB HBM3"
                      gpu_memory_capacity_mib: 81920
                      sm_active_avg: 0.01
                      tensor_pipe_active_avg: 0.005
                      dram_active_avg: 0.02
                      fb_usage_avg: 512.0
            embeddings-mig-ros:
              namespace_labels: project_name:embeddings-mig-ros
              pods:
                - pod:
                  pod_name: embeddings-mig-worker
                  cpu_request: 2
                  mem_request_gig: 8
                  cpu_limit: 4
                  mem_limit_gig: 16
                  pod_seconds: 3600
                  cpu_usage:
                    full_period: 1.0
                  mem_usage_gig:
                    full_period: 6
                  labels: label_app:embeddings|label_workload:inference
                  gpus:
                    - gpu:
                      gpu_model: "NVIDIA H100 80GB HBM3"
                      gpu_memory_capacity_mib: 81920
                      sm_active_avg: 0.10
                      tensor_pipe_active_avg: 0.06
                      dram_active_avg: 0.12
                      fb_usage_avg: 3500.0
