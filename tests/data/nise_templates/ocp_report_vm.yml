---
# OCP Virtualization ROS usage for VM recommendation E2E.
# Generates ocp_ros_vm_usage.csv (15-minute intervals) via OCPVirtualMachineGenerator.
#
# Use with generate_nise_data(..., iqe_template="ocp_report_vm.yml", include_ros=True)
generators:
  - OCPVirtualMachineGenerator:
      start_date: last_month
      end_date: today
      vms:
        # Active Linux VM with guest agent
        - vm_name: web-server-linux-01
          namespace: production
          node_name: worker-1
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
        # Idle Linux VM with guest agent
        - vm_name: idle-vm-linux-01
          namespace: dev
          node_name: worker-3
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 40
          idle: true
        # Active Windows VM with guest agent
        - vm_name: db-server-windows-01
          namespace: production
          node_name: worker-2
          guest_os: windows
          guest_agent: true
          vcpu: 8
          memory_gib: 32
          disk_gib: 500
        # Active Linux VM without guest agent
        - vm_name: legacy-app-01
          namespace: legacy
          node_name: worker-1
          guest_os: linux
          guest_agent: false
          vcpu: 2
          memory_gib: 4
          disk_gib: 50
        # Idle Windows VM without guest agent
        - vm_name: idle-windows-legacy-01
          namespace: legacy
          node_name: worker-2
          guest_os: windows
          guest_agent: false
          vcpu: 2
          memory_gib: 4
          disk_gib: 50
          idle: true
        # Abandoned VM: zero CPU/memory for abandoned detection (notification code 43)
        - vm_name: abandoned-test-vm-01
          namespace: forgotten-project
          node_name: worker-1
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 50
          abandoned: true
        # Performance downsize held (notification 49) — matches IQE downsize-unstable-vm-01
        - vm_name: downsize-unstable-vm-01
          namespace: vm-enhancements
          node_name: worker-3
          guest_os: linux
          guest_agent: true
          vcpu: 8
          memory_gib: 16
          disk_gib: 100
          downsize_unstable: true
        # Preference metadata via cluster_instance_types.json (extended preference E2E)
        - vm_name: preference-server-vm
          namespace: production
          node_name: worker-1
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
          fixed_usage:
            cpu_pct: 0.45
            mem_pct: 0.60
