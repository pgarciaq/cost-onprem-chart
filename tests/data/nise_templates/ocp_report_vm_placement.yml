---
# OCP VM ROS data for placement / NUMA E2E (notifications 60, 62, 63).
# Use with generate_nise_data(..., iqe_template="ocp_report_vm_placement.yml", include_ros=True)
generators:
  - OCPVirtualMachineGenerator:
      start_date: last_month
      end_date: today
      vms:
        - vm_name: ha-primary-vm-01
          namespace: vm-placement
          node_name: worker-1
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
          fixed_usage:
            cpu_pct: 0.40
            mem_pct: 0.55
        - vm_name: ha-standby-vm-01
          namespace: vm-placement
          node_name: worker-1
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
          fixed_usage:
            cpu_pct: 0.38
            mem_pct: 0.52
        - vm_name: numa-oversized-vm-01
          namespace: vm-placement
          node_name: worker-2
          guest_os: linux
          guest_agent: true
          vcpu: 16
          memory_gib: 128
          disk_gib: 200
          fixed_usage:
            cpu_pct: 0.55
            mem_pct: 0.70
