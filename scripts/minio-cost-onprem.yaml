# Standalone MinIO for cost-onprem (no ODF). Apply before install-helm-chart.sh.
# Buckets: created by install-helm-chart.sh when S3_* env vars are set.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: cost-onprem
  labels:
    app: minio
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lvms-vg1
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: cost-onprem
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # quay.io/minio/minio is auth-gated since 2025; bitnamilegacy mirror
          # is public multi-arch (arm64 verified). Bitnami layout: no server
          # args, data at /bitnami/minio/data, console on 9001.
          image: docker.io/bitnamilegacy/minio:2025.5.24
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin123
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /bitnami/minio/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: cost-onprem
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
